<!DOCTYPE html>

<html>

<head>

	<meta charset="UTF-8">

	<title>Interactive learning</title>

	<link rel="stylesheet" href="pretty.css">

    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
	<script type="module" src="supercode.js"></script>

</head>

<body>

	<div class="screen-chat">



		<div id="chat-box">
			<div id="output-box">



            </div>

			<div id="input-box">
				<form id="input-form" type="text">
                    <input id="file-input" type="file">
					<textarea id="input" type="text" placeholder="The world awaits..."></textarea>
					<button type="submit">Send</button>
				</form>
			</div>
		</div>

		<img src="images/settings img.jpg" id="settings-button" alt="settings">


	</div>

	<div class="screen-settings unactive">
		<img src="images/back-button.jpg" id="chat-button" alt="back">

		<label for="instructions-input">Instructions:</label>
		<textarea id="instructions-input" type="text" placeholder="zero mistakes. answer good. think hard. "></textarea>
		<br>
		<br>
		<input id="api-key-input" type="text">
		<br>
		<br>
        <button id="download-btn"> download savedata </button>
        <input type="file" id="upload-history-btn">
		<a href="https://ai.google.dev/gemini-api/docs/models" target="_blank">about models: click me!</a>
		<form id="model-selection">
			<label for="model-select">Select Model:</label>
			<select id="model-select">
				<option value="gemini-3.5-flash-lite">Gemini 3.5 flash-lite super fast reccomend</option>
				<option value="gemini-3.8-flash" selected>Gemini 3.8 flash smarter also good</option>
				<option value="gemini-3.6-flash">Gemini 3.6 flash less smart but faster than 3.8</option>
				<option value="gemini-3.1-flash-lite">Gemini 3.1 flash lite fastest</option>

			</select>
		</form>
	</div>

</body>

</html>
